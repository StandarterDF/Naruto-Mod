  - main [ref=f1e14]:
    - generic [ref=f1e16]:
      - 'heading "Naruto Mod Стань ниндзя: печати, чакра и клоны" [level=1] [ref=f1e17]':
        - generic [ref=f1e18]: Naruto Mod
        - text: "Стань ниндзя: печати, чакра и клоны"
      - paragraph [ref=f1e19]:
        - text: Порт
        - strong [ref=f1e20]: Sekwah's Naruto Mod
        - text: "на Minecraft 1.20.1 / Forge: техники набираются последовательностью клавиш, чакра и стамина тратятся на каждую из них, а теневые клоны копируют твой стиль боя — вплоть до щита, лука и бумажной бомбы."
      - paragraph [ref=f1e21]: Версия форка 1.8.1-SNAPSHOT · Minecraft 1.20.1 · Forge
      - generic [ref=f1e22]:
        - link "Смотреть техники" [ref=f1e23] [cursor=pointer]:
          - /url: techniques.html
        - link "Секреты мода" [ref=f1e24] [cursor=pointer]:
          - /url: secrets.html
    - generic [ref=f1e25]:
      - generic [ref=f1e26]:
        - heading "Что это" [level=2] [ref=f1e27]
        - paragraph [ref=f1e28]: "Мод добавляет в игру ниндзя-механику: комбинации клавиш превращаются в техники, у каждой техники своя цена в чакре (иногда — в стамине или в замене), а часть техник работает только при удержании клавиши. Цель этого форка — поведение, максимально близкое к версии 1.7.10, плюс новые техники."
        - generic [ref=f1e29]:
          - article [ref=f1e30]:
            - generic [ref=f1e31]: Техники
            - heading "Комбо из трёх печатей" [level=3] [ref=f1e32]
            - paragraph [ref=f1e33]:
              - text: Любая техника — это последовательность клавиш, набранная в один поток (паузы меньше ~0.75 секунды). В документации комбо записаны цифрами
              - code [ref=f1e34]: 1 = C
              - text: ","
              - code [ref=f1e35]: 2 = V
              - text: ","
              - code [ref=f1e36]: 3 = B
              - text: и продублированы буквами.
          - article [ref=f1e37]:
            - generic [ref=f1e38]: Клоны
            - heading "Теневые клоны с твоим оружием" [level=3] [ref=f1e39]
            - paragraph [ref=f1e40]: "Клон получает 1 единицу здоровья, поэтому любой непокрытый удар его «попает». Зато он копирует скин, обе руки, четыре слота брони, эффекты и стрелы — и дерётся как ты: щит, лук, арбалет или трезубец."
          - article [ref=f1e41]:
            - generic [ref=f1e42]: Прогресс
            - heading "Восемь врат и Режим Мудреца" [level=3] [ref=f1e43]
            - paragraph [ref=f1e44]: Врата дают растущие эффекты и снимают здоровье по квадратичной формуле, а седьмые закрыть ещё можно, восьмые — только смертью. Сенин-мана питает Режим Мудреца, который сам гаснет, когда пул пуст.
          - article [ref=f1e45]:
            - generic [ref=f1e46]: Пространство
            - heading "Карманное измерение Камуи" [level=3] [ref=f1e47]
            - paragraph [ref=f1e48]:
              - text: Шаг в
              - code [ref=f1e49]: narutomod:kamui
              - text: — поле каменных столбов под небом Края, между которыми настоящая пустота. Затянутая цель возвращается обратно по таймеру, так что карман — тюрьма, а не способ отобрать чужой лут.
      - generic [ref=f1e50]:
        - heading "Как начать" [level=2] [ref=f1e51]
        - paragraph [ref=f1e52]: Чтобы пользоваться техниками, сначала нужно стать ниндзя. Делается это прямо из меню техник.
        - list [ref=f1e53]:
          - listitem [ref=f1e54]:
            - text: Нажми
            - generic [ref=f1e55]: J
            - text: — откроется меню техник.
          - listitem [ref=f1e56]:
            - text: Нажми «Стать ниндзя» (
            - code [ref=f1e57]: naruto.gui.jutsu.enable
            - text: ) — и станешь ниндзя. Обратно — кнопкой «Я передумал» (
            - code [ref=f1e58]: naruto.gui.jutsu.disable
            - text: ).
          - listitem [ref=f1e59]:
            - text: После этого меню показывает
            - strong [ref=f1e60]: весь список техник
            - text: ", разбитый по группам, с клавишами к каждой. До посвящения вместо списка висит подсказка «Стань ниндзя, чтобы увидеть список техник»."
          - listitem [ref=f1e61]:
            - text: Список листается кнопками
            - code [ref=f1e62]: <
            - text: /
            - code [ref=f1e63]: ">"
            - text: — по 10 строк на страницу. Группа, которая не поместилась целиком, печатает свой заголовок заново на новой странице.
          - listitem [ref=f1e64]:
            - text: То же самое в чате делает команда
            - code [ref=f1e65]: /jutsu list
            - text: .
        - generic [ref=f1e66]:
          - heading "Клавиши не зависят от раскладки" [level=3] [ref=f1e67]
          - paragraph [ref=f1e68]: В меню буквы клавиш рисуются по коду клавиши (A–Z), поэтому на русской раскладке комбо не превращается в кириллицу, а переназначенные клавиши отображаются корректно.
        - heading "Базовое управление" [level=3] [ref=f1e69]
        - table [ref=f1e71]:
          - caption [ref=f1e72]: Клавиши по умолчанию
          - rowgroup [ref=f1e73]:
            - row [ref=f1e74]:
