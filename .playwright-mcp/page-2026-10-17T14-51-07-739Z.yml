              - columnheader "Восстановление" [ref=f1e119]
          - rowgroup [ref=f1e120]:
            - row [ref=f1e121]:
              - cell "Чакра" [ref=f1e122]
              - cell "100" [ref=f1e123]
              - cell "+0.05 за тик (1 в секунду) после задержки регенерации" [ref=f1e124]
            - row [ref=f1e125]:
              - cell "Стамина" [ref=f1e126]
              - cell "100" [ref=f1e127]
              - cell "+0.4 за тик (8 в секунду) после задержки регенерации" [ref=f1e128]
            - row [ref=f1e129]:
