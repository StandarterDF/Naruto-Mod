              - cell "X" [ref=f1e79]
              - cell "Прыжок (Leap)" [ref=f1e81]
            - row [ref=f1e82]:
              - cell "C" [ref=f1e83]
              - cell "«1» в комбо-последовательности" [ref=f1e85]
            - row [ref=f1e86]:
              - cell "V" [ref=f1e87]
              - cell "«2» в комбо-последовательности" [ref=f1e89]
            - row [ref=f1e90]:
              - cell "B" [ref=f1e91]
              - cell "«3» в комбо-последовательности" [ref=f1e93]
            - row [ref=f1e94]:
              - cell "J" [ref=f1e95]
              - 'cell "Меню дзюцу: список всех техник с их клавишами плюс включение и выключение режима ниндзя" [ref=f1e97]'
            - row [ref=f1e98]:
              - cell "Прыжок в воздухе" [ref=f1e99]
              - cell "Двойной прыжок (сам, без комбо)" [ref=f1e100]
        - heading "Тап, удержание и переключатели" [level=3] [ref=f1e101]
        - list [ref=f1e102]:
          - listitem [ref=f1e103]:
            - strong [ref=f1e104]: Мгновенные техники
            - text: — набрал комбо и просто подожди полсекунды, техника сработает сама.
          - listitem [ref=f1e105]:
            - strong [ref=f1e106]: Канальные техники
            - text: — последнюю клавишу комбо надо зажать. Отпустил раньше ~0.75 секунды — это «тап» (короткий вариант), держишь дольше — техника заряжается и работает, пока клавиша нажата.
          - listitem [ref=f1e107]:
            - strong [ref=f1e108]: Переключатели
            - text: — набрал комбо, техника включилась; набрал то же комбо ещё раз — выключилась.
      - generic [ref=f1e109]:
        - heading "Системы мода" [level=2] [ref=f1e110]
        - paragraph [ref=f1e111]: Ресурсы, которые тратят техники, и два больших «режима», вокруг которых построена половина арсенала.
        - table [ref=f1e113]:
          - caption [ref=f1e114]: "Ресурсы: максимум и восстановление"
          - rowgroup [ref=f1e115]:
            - row [ref=f1e116]:
