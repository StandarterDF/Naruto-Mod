              - cell "3" [ref=f1e131]
              - cell "+1 каждые 60 тиков (3 секунды)" [ref=f1e132]
        - generic [ref=f1e133]:
          - heading "Задержка регенерации — скрытая цена" [level=3] [ref=f1e134]
          - paragraph [ref=f1e135]: "Любая техника после траты накладывает задержку регенерации: своё число тиков, в течение которых ресурс не восстанавливается. Именно поэтому дешёвая на вид техника на практике может стоить дороже — она «съедает» регенерацию на несколько секунд."
        - generic [ref=f1e136]:
          - article [ref=f1e137]:
            - generic [ref=f1e138]: Полоски
            - heading "Чакра, стамина и сенин-мана" [level=3] [ref=f1e139]
            - paragraph [ref=f1e140]:
              - text: Чакра и стамина рисуются полосками интерфейса. Текущая сенин-мана показывается полоской
              - strong [ref=f1e141]: того же вида, что и чакра, прямо над ней
              - text: ", отличается только зелёная заливка в цвет частиц сенина, с цифрами «текущая/максимум»."
            - paragraph [ref=f1e142]: "Плашка сенин-маны появляется, только когда есть что показывать: пустая пустому новичку не нужна."
          - article [ref=f1e143]:
            - generic [ref=f1e144]: Природная энергия
            - heading "Режим Мудреца" [level=3] [ref=f1e145]
            - paragraph [ref=f1e146]:
              - text: Сенин-ману копит
              - strong [ref=f1e147]: Сбор природной энергии
              - text: (
              - code [ref=f1e148]: "231"
              - text: "): только стоя на земле неподвижно, по 0.5 за тик. Максимум пула по умолчанию 100, и пул записывается в сохранение."
            - paragraph [ref=f1e149]:
              - strong [ref=f1e150]: Режим Мудреца
              - text: (
              - code [ref=f1e151]: "232"
              - text: ) требует минимум 50 сенин-маны, тратит её по 0.25 за тик и сам гаснет, когда пул кончился. Смерть и выход из игры тоже его закрывают.
            - paragraph [ref=f1e152]:
              - link "Подробнее в разделе «Усиление тела» →" [ref=f1e153] [cursor=pointer]:
                - /url: techniques.html#body
          - article [ref=f1e154]:
            - generic [ref=f1e155]: Восемь врат
            - heading "Сила за здоровье" [level=3] [ref=f1e156]
            - paragraph [ref=f1e157]:
              - text: "Каждый каст открывает следующие врата: 25 чакры и 15 стамины за каждые. Эффекты растут с числом врат, а плата — слив здоровья по формуле"
              - code [ref=f1e158]: 0.00833 × (число врат)²
              - text: в секунду, целыми единицами и напрямую, мимо любой защиты.
            - paragraph [ref=f1e159]: Врата с 1 по 7 закрываются бесплатной техникой «Запечатать врата», а восьмые — только смертью.
            - paragraph [ref=f1e160]:
              - link "Открыть таблицу врат →" [ref=f1e161] [cursor=pointer]:
                - /url: techniques.html#body
