                - generic [ref=f2e100]: C
                - generic [ref=f2e101]: C
              - generic [ref=f2e102]: "цифрами: 11"
            - paragraph [ref=f2e104]: "Стойка «работать и драться»: копание ускоряется, а ближний удар становится сильнее — за чакру."
            - list [ref=f2e105]:
              - listitem [ref=f2e106]: "Копание: в 2.5 раза быстрее"
              - listitem [ref=f2e107]: "За блок: 1 чакра"
              - listitem [ref=f2e108]: "За удар: 3 чакры и +3 урона"
              - listitem [ref=f2e109]: "Налог: 0.02 чакры за тик"
            - list [ref=f2e110]:
              - listitem [ref=f2e111]:
                - text: "Полезно знать: ×2.5 — это умножение"
                - emphasis [ref=f2e112]: той
                - text: скорости, которую уже посчитала ваниль вместе с инструментом. С киркой берётся скорость с киркой и умножается, а не «просто в два с половиной раза быстрее, чем рукой».
              - listitem [ref=f2e113]: "Полезно знать: регенерация чакры «придавлена» на 10 тиков, поэтому стойка стоит не только налогом."
      - generic [ref=f2e114]:
        - heading "Теневые клоны" [level=2] [ref=f2e115]
        - paragraph [ref=f2e116]:
          - text: Все четыре техники призывают одну и ту же сущность клона с разными настройками. Любой призыв требует
          - strong [ref=f2e117]: чакра-печать
          - text: в инвентаре и тратит
          - strong [ref=f2e118]: одну
          - text: печать за каст — независимо от числа клонов. В креативе печать не нужна и не тратится; нет печати —
          - code [ref=f2e119]: jutsu.fail.noseal
          - text: .
        - generic [ref=f2e120]:
          - heading "Как ведут себя клоны" [level=3] [ref=f2e121]
          - list [ref=f2e122]:
            - listitem [ref=f2e123]:
              - strong [ref=f2e124]: 1 единица здоровья
              - text: ": любой непокрытый удар «попает» клона. Смерть — облако дыма и звук"
              - code [ref=f2e125]: clone_poof
              - text: ", без лута и без трупа."
            - listitem [ref=f2e126]:
              - text: Клон
              - strong [ref=f2e127]: не
              - text: деспавнится по расстоянию и не исчезает сам, кроме конца времени жизни.
            - listitem [ref=f2e128]:
              - text: Цели
              - strong [ref=f2e129]: только реактивные
              - text: ": ударили клона — ответил; ранили владельца — напал на обидчика; владелец сам кого-то ударил — напал на его цель. Сам клон врагов не ищет."
            - listitem [ref=f2e130]:
              - text: Клон копирует
              - strong [ref=f2e131]: стиль боя кастера
              - text: "в момент призыва: скин, обе руки и четыре слота брони, эффекты (и баффы, и дебаффы) и стрелы."
            - listitem [ref=f2e132]:
              - strong [ref=f2e133]: Щит
              - text: из левой руки владельца клон поднимает заранее, пока есть цель и он не стреляет.
            - listitem [ref=f2e134]:
              - strong [ref=f2e135]: Лук, арбалет и трезубец
              - text: работают как у игрока, с их зачарованиями; ближе 3 блоков клон убирает дальнобойное оружие и бьёт мечом.
            - listitem [ref=f2e136]:
              - strong [ref=f2e137]: Стрелы
              - text: "— копия: тип берётся из первой стопки стрел кастера, количество — сумма всех стрел. Каждый выстрел уменьшает запас, и когда стрел не осталось, клон исчезает."
            - listitem [ref=f2e138]:
              - strong [ref=f2e139]: Бумажная бомба
              - text: "в руке кастера при призыве делает клона взрывным: он взрывается, когда его убивают. Бомба у кастера не тратится, блоки не ломаются."
