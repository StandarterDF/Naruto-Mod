              - listitem [ref=f2e846]: "Полезно знать: печать рабочего не расходуется — это катализатор, но чакра-печать за каст всё равно тратится. Инструмент из твоего инвентаря тоже не тратится: клон работает копией и прекращает работу, когда она сломается."
              - listitem [ref=f2e847]: "Полезно знать: опыт за убийство не теряется: если клон добивает моба, XP уходит сразу тебе, а не орбами на месте смерти."
