        - heading "Основы" [level=2] [ref=f2e54]
        - paragraph [ref=f2e55]: "Три стойки, которые всегда под рукой: заряд чакры, ходьба по воде и чакра-кулак."
        - generic [ref=f2e56]:
          - article [ref=f2e57]:
            - generic [ref=f2e58]:
              - heading "Чакра-заряд" [level=3] [ref=f2e59]
              - generic [ref=f2e60]: Канал
            - generic [ref=f2e61]:
              - generic [ref=f2e62]:
                - generic [ref=f2e63]: Комбо
                - generic [ref=f2e64]: C
              - generic [ref=f2e65]: "цифрами: 1"
            - paragraph [ref=f2e67]: "Базовая техника «наполнить полоску»: пока держишь комбо, кастер набирает чакру. Без удержания (тапом) не работает вообще."
            - list [ref=f2e68]:
              - listitem [ref=f2e69]: "Стоя на земле: +1 чакры за тик"
              - listitem [ref=f2e70]: "На бегу или в воздухе: +0.2 чакры за тик"
            - list [ref=f2e71]:
              - listitem [ref=f2e72]: "Полезно знать: стоя канал в пять раз выгоднее, чем на ходу — дешевле остановиться и подождать."
              - listitem [ref=f2e73]: "Полезно знать: тапом эта техника не даёт ничего, ей нужно именно удержание."
          - article [ref=f2e74]:
            - generic [ref=f2e75]:
              - heading "Водная походка" [level=3] [ref=f2e76]
              - generic [ref=f2e77]: Переключатель
            - generic [ref=f2e78]:
              - generic [ref=f2e79]:
                - generic [ref=f2e80]: Комбо
                - generic [ref=f2e81]: B
              - generic [ref=f2e82]: "цифрами: 3"
            - paragraph [ref=f2e84]: Держит игрока на воде и не даёт проваливаться. Пока поверхность воды «под ногами» — дешёвая; если техника вытолкнула игрока вверх из глубокого провала — дорогая.
            - list [ref=f2e85]:
              - listitem [ref=f2e86]: "По поверхности: 0.12 чакры за тик"
              - listitem [ref=f2e87]: "Выталкивает вверх: 1 чакра за тик"
              - listitem [ref=f2e88]: "Тип: переключатель"
            - list [ref=f2e89]:
              - listitem [ref=f2e90]: "Полезно знать: пока техника работает, она возвращает заряд двойного прыжка и гасит падение."
              - listitem [ref=f2e91]:
                - text: "Полезно знать: на транспорте не работает ("
                - code [ref=f2e92]: jutsu.fail.riding
                - text: ).
          - article [ref=f2e93]:
            - generic [ref=f2e94]:
              - heading "Чакра-кулак" [level=3] [ref=f2e95]
              - generic [ref=f2e96]: Переключатель
            - generic [ref=f2e97]:
