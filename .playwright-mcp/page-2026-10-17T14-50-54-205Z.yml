  - main [ref=e14]:
    - generic [ref=e16]:
      - 'heading "Naruto Mod Стань ниндзя: печати, чакра и клоны" [level=1] [ref=e17]':
        - generic [ref=e18]: Naruto Mod
        - text: "Стань ниндзя: печати, чакра и клоны"
      - paragraph [ref=e19]:
        - text: Порт
        - strong [ref=e20]: Sekwah's Naruto Mod
        - text: "на Minecraft 1.20.1 / Forge: техники набираются последовательностью клавиш, чакра и стамина тратятся на каждую из них, а теневые клоны копируют твой стиль боя — вплоть до щита, лука и бумажной бомбы."
      - paragraph [ref=e21]: Версия форка 1.8.1-SNAPSHOT · Minecraft 1.20.1 · Forge
      - generic [ref=e22]:
        - link "Смотреть техники" [ref=e23] [cursor=pointer]:
          - /url: techniques.html
        - link "Секреты мода" [ref=e24] [cursor=pointer]:
          - /url: secrets.html
    - generic [ref=e25]:
      - generic [ref=e26]:
        - heading "Что это" [level=2] [ref=e27]
        - paragraph [ref=e28]: "Мод добавляет в игру ниндзя-механику: комбинации клавиш превращаются в техники, у каждой техники своя цена в чакре (иногда — в стамине или в замене), а часть техник работает только при удержании клавиши. Цель этого форка — поведение, максимально близкое к версии 1.7.10, плюс новые техники."
        - generic [ref=e29]:
          - article [ref=e30]:
            - generic [ref=e31]: Техники
            - heading "Комбо из трёх печатей" [level=3] [ref=e32]
            - paragraph [ref=e33]:
              - text: Любая техника — это последовательность клавиш, набранная в один поток (паузы меньше ~0.75 секунды). В документации комбо записаны цифрами
              - code [ref=e34]: 1 = C
              - text: ","
              - code [ref=e35]: 2 = V
              - text: ","
              - code [ref=e36]: 3 = B
              - text: и продублированы буквами.
          - article [ref=e37]:
            - generic [ref=e38]: Клоны
            - heading "Теневые клоны с твоим оружием" [level=3] [ref=e39]
            - paragraph [ref=e40]: "Клон получает 1 единицу здоровья, поэтому любой непокрытый удар его «попает». Зато он копирует скин, обе руки, четыре слота брони, эффекты и стрелы — и дерётся как ты: щит, лук, арбалет или трезубец."
          - article [ref=e41]:
            - generic [ref=e42]: Прогресс
            - heading "Восемь врат и Режим Мудреца" [level=3] [ref=e43]
            - paragraph [ref=e44]: Врата дают растущие эффекты и снимают здоровье по квадратичной формуле, а седьмые закрыть ещё можно, восьмые — только смертью. Сенин-мана питает Режим Мудреца, который сам гаснет, когда пул пуст.
          - article [ref=e45]:
            - generic [ref=e46]: Пространство
            - heading "Карманное измерение Камуи" [level=3] [ref=e47]
            - paragraph [ref=e48]:
              - text: Шаг в
              - code [ref=e49]: narutomod:kamui
              - text: — поле каменных столбов под небом Края, между которыми настоящая пустота. Затянутая цель возвращается обратно по таймеру, так что карман — тюрьма, а не способ отобрать чужой лут.
      - generic [ref=e50]:
        - heading "Как начать" [level=2] [ref=e51]
        - paragraph [ref=e52]: Чтобы пользоваться техниками, сначала нужно стать ниндзя. Делается это прямо из меню техник.
        - list [ref=e53]:
          - listitem [ref=e54]:
            - text: Нажми
            - generic [ref=e55]: J
            - text: — откроется меню техник.
          - listitem [ref=e56]:
            - text: Нажми «Стать ниндзя» (
            - code [ref=e57]: naruto.gui.jutsu.enable
            - text: ) — и станешь ниндзя. Обратно — кнопкой «Я передумал» (
            - code [ref=e58]: naruto.gui.jutsu.disable
            - text: ).
          - listitem [ref=e59]:
            - text: После этого меню показывает
            - strong [ref=e60]: весь список техник
            - text: ", разбитый по группам, с клавишами к каждой. До посвящения вместо списка висит подсказка «Стань ниндзя, чтобы увидеть список техник»."
          - listitem [ref=e61]:
            - text: Список листается кнопками
            - code [ref=e62]: <
            - text: /
            - code [ref=e63]: ">"
            - text: — по 10 строк на страницу. Группа, которая не поместилась целиком, печатает свой заголовок заново на новой странице.
          - listitem [ref=e64]:
            - text: То же самое в чате делает команда
            - code [ref=e65]: /jutsu list
            - text: .
        - generic [ref=e66]:
          - heading "Клавиши не зависят от раскладки" [level=3] [ref=e67]
          - paragraph [ref=e68]: В меню буквы клавиш рисуются по коду клавиши (A–Z), поэтому на русской раскладке комбо не превращается в кириллицу, а переназначенные клавиши отображаются корректно.
        - heading "Базовое управление" [level=3] [ref=e69]
        - table [ref=e71]:
