              - cell "Прыжок (Leap)" [ref=e81]
            - row [ref=e82]:
              - cell "C" [ref=e83]
              - cell "«1» в комбо-последовательности" [ref=e85]
            - row [ref=e86]:
              - cell "V" [ref=e87]
              - cell "«2» в комбо-последовательности" [ref=e89]
            - row [ref=e90]:
              - cell "B" [ref=e91]
              - cell "«3» в комбо-последовательности" [ref=e93]
            - row [ref=e94]:
              - cell "J" [ref=e95]
              - 'cell "Меню дзюцу: список всех техник с их клавишами плюс включение и выключение режима ниндзя" [ref=e97]'
            - row [ref=e98]:
              - cell "Прыжок в воздухе" [ref=e99]
              - cell "Двойной прыжок (сам, без комбо)" [ref=e100]
        - heading "Тап, удержание и переключатели" [level=3] [ref=e101]
        - list [ref=e102]:
          - listitem [ref=e103]:
            - strong [ref=e104]: Мгновенные техники
            - text: — набрал комбо и просто подожди полсекунды, техника сработает сама.
          - listitem [ref=e105]:
            - strong [ref=e106]: Канальные техники
            - text: — последнюю клавишу комбо надо зажать. Отпустил раньше ~0.75 секунды — это «тап» (короткий вариант), держишь дольше — техника заряжается и работает, пока клавиша нажата.
          - listitem [ref=e107]:
            - strong [ref=e108]: Переключатели
            - text: — набрал комбо, техника включилась; набрал то же комбо ещё раз — выключилась.
      - generic [ref=e109]:
        - heading "Системы мода" [level=2] [ref=e110]
        - paragraph [ref=e111]: Ресурсы, которые тратят техники, и два больших «режима», вокруг которых построена половина арсенала.
        - table [ref=e113]:
          - caption [ref=e114]: "Ресурсы: максимум и восстановление"
          - rowgroup [ref=e115]:
            - row [ref=e116]:
              - columnheader "Ресурс" [ref=e117]
              - columnheader "Максимум" [ref=e118]
              - columnheader "Восстановление" [ref=e119]
          - rowgroup [ref=e120]:
            - row [ref=e121]:
              - cell "Чакра" [ref=e122]
              - cell "100" [ref=e123]
              - cell "+0.05 за тик (1 в секунду) после задержки регенерации" [ref=e124]
            - row [ref=e125]:
              - cell "Стамина" [ref=e126]
              - cell "100" [ref=e127]
              - cell "+0.4 за тик (8 в секунду) после задержки регенерации" [ref=e128]
            - row [ref=e129]:
              - cell "Замены" [ref=e130]
              - cell "3" [ref=e131]
              - cell "+1 каждые 60 тиков (3 секунды)" [ref=e132]
        - generic [ref=e133]:
          - heading "Задержка регенерации — скрытая цена" [level=3] [ref=e134]
          - paragraph [ref=e135]: "Любая техника после траты накладывает задержку регенерации: своё число тиков, в течение которых ресурс не восстанавливается. Именно поэтому дешёвая на вид техника на практике может стоить дороже — она «съедает» регенерацию на несколько секунд."
        - generic [ref=e136]:
          - article [ref=e137]:
            - generic [ref=e138]: Полоски
            - heading "Чакра, стамина и сенин-мана" [level=3] [ref=e139]
            - paragraph [ref=e140]:
              - text: Чакра и стамина рисуются полосками интерфейса. Текущая сенин-мана показывается полоской
              - strong [ref=e141]: того же вида, что и чакра, прямо над ней
              - text: ", отличается только зелёная заливка в цвет частиц сенина, с цифрами «текущая/максимум»."
            - paragraph [ref=e142]: "Плашка сенин-маны появляется, только когда есть что показывать: пустая пустому новичку не нужна."
          - article [ref=e143]:
            - generic [ref=e144]: Природная энергия
            - heading "Режим Мудреца" [level=3] [ref=e145]
            - paragraph [ref=e146]:
              - text: Сенин-ману копит
              - strong [ref=e147]: Сбор природной энергии
              - text: (
              - code [ref=e148]: "231"
              - text: "): только стоя на земле неподвижно, по 0.5 за тик. Максимум пула по умолчанию 100, и пул записывается в сохранение."
            - paragraph [ref=e149]:
              - strong [ref=e150]: Режим Мудреца
              - text: (
              - code [ref=e151]: "232"
              - text: ) требует минимум 50 сенин-маны, тратит её по 0.25 за тик и сам гаснет, когда пул кончился. Смерть и выход из игры тоже его закрывают.
            - paragraph [ref=e152]:
              - link "Подробнее в разделе «Усиление тела» →" [ref=e153] [cursor=pointer]:
                - /url: techniques.html#body
          - article [ref=e154]:
            - generic [ref=e155]: Восемь врат
            - heading "Сила за здоровье" [level=3] [ref=e156]
            - paragraph [ref=e157]:
              - text: "Каждый каст открывает следующие врата: 25 чакры и 15 стамины за каждые. Эффекты растут с числом врат, а плата — слив здоровья по формуле"
              - code [ref=e158]: 0.00833 × (число врат)²
              - text: в секунду, целыми единицами и напрямую, мимо любой защиты.
            - paragraph [ref=e159]: Врата с 1 по 7 закрываются бесплатной техникой «Запечатать врата», а восьмые — только смертью.
            - paragraph [ref=e160]:
              - link "Открыть таблицу врат →" [ref=e161] [cursor=pointer]:
                - /url: techniques.html#body
